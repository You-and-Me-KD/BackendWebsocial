services:
  auths:
    build:
      context: .
      dockerfile: ./apps/auths/Dockerfile
      target: development
    command: yarn start:dev auths
    env_file:
      - ./apps/auths/.env
    ports:
      - '${AUTHS_PORT}:2801'
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgresdb
  users:
    build:
      context: .
      dockerfile: ./apps/users/Dockerfile
      target: development
    command: yarn start:dev users
    env_file:
      - ./apps/users/.env
    ports:
      - '${USERS_PORT}:2802'
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgresdb
  files:
    build:
      context: .
      dockerfile: ./apps/files/Dockerfile
      target: development
    command: yarn start:dev files
    env_file:
      - ./apps/files/.env
    ports:
      - '${FILES_PORT}:2803'
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgresdb
  socials:
    build:
      context: .
      dockerfile: ./apps/socials/Dockerfile
      target: development
    command: yarn start:dev socials
    env_file:
      - ./apps/socials/.env
    ports:
      - '${SOCIALS_PORT}:2804'
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgresdb
  chats:
    build:
      context: .
      dockerfile: ./apps/chats/Dockerfile
      target: development
    command: yarn start:dev chats
    env_file:
      - ./apps/chats/.env
    ports:
      - '${CHATS_PORT}:2805'
    volumes:
      - .:/usr/src/app
    depends_on:
      - mongodb
  notifications:
    build:
      context: .
      dockerfile: ./apps/notifications/Dockerfile
      target: development
    command: yarn start:dev notifications
    env_file:
      - ./apps/notifications/.env
    ports:
      - '${NOTIFICATIONS_PORT}:2806'
    volumes:
      - .:/usr/src/app
    depends_on:
      - mongodb
  groups:
    build:
      context: .
      dockerfile: ./apps/groups/Dockerfile
      target: development
    command: yarn start:dev groups
    env_file:
      - ./apps/groups/.env
    ports:
      - '${GROUPS_PORT}:2807'
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgresdb
  marketplaces:
    build:
      context: .
      dockerfile: ./apps/marketplaces/Dockerfile
      target: development
    command: yarn start:dev marketplaces
    env_file:
      - ./apps/marketplaces/.env
    ports:
      - '${MARKETPLACES_PORT}:2808'
    volumes:
      - .:/usr/src/app
    depends_on:
      - postgresdb
  mails:
    build:
      context: .
      dockerfile: ./apps/mails/Dockerfile
      target: development
    command: yarn start:dev mails
    env_file:
      - ./apps/mails/.env
    volumes:
      - .:/usr/src/app
    depends_on:
      - maildev
  mongodb:
    image: mongo:latest
    # restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_MULTIPLE_DATABASES: ${MONGO_MULTIPLE_DATABASES}
    ports:
      - '${MONGO_PORT}:27017'
    volumes:
      - mongo-data:/data/db
      - ./init-scripts/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
  postgresdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    ports:
      - '${DATABASE_PUBLISH_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
  maildev:
    image: maildev/maildev:latest
    container_name: maildev
    restart: always
    ports:
      - '${MAIL_CLIENT_PORT}:1080'
      - '${MAIL_PORT}:1025'
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis-data:/data  
volumes:
  postgres-data:
  mongo-data:
  redis-data:
